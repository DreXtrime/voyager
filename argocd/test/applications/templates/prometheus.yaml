apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.spec.project }}
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 67.9.0
    helm:
      valuesObject:
        nodeSelector:
          pool: monitoring
        tolerations:
          - key: pool
            value: monitoring
            effect: NoSchedule
        prometheus:
          prometheusSpec:
            nodeSelector:
              pool: monitoring
            tolerations:
              - key: pool
                value: monitoring
                effect: NoSchedule
            retention: 7d
            storageSpec:
              volumeClaimTemplate:
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 10Gi
        alertmanager:
          alertmanagerSpec:
            nodeSelector:
              pool: monitoring
            tolerations:
              - key: pool
                value: monitoring
                effect: NoSchedule
        grafana:
          enabled: false
        prometheusOperator:
          nodeSelector:
            pool: monitoring
          tolerations:
            - key: pool
              value: monitoring
              effect: NoSchedule
        kube-state-metrics:
          nodeSelector:
            pool: monitoring
          tolerations:
            - key: pool
              value: monitoring
              effect: NoSchedule
        nodeExporter:
          enabled: true
  destination:
    server: {{ .Values.spec.destination.server }}
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true