apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.spec.project }}
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 6.24.0
    helm:
      valuesObject:
        nodeSelector:
          pool: monitoring
        tolerations:
          - key: pool
            value: monitoring
            effect: NoSchedule
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          storage:
            type: gcs
            bucketNames:
              chunks: tanel-test-509115-logs
              ruler: tanel-test-509115-logs
              admin: tanel-test-509115-logs
          schemaConfig:
            configs:
              - from: "2024-01-01"
                store: tsdb
                object_store: gcs
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
        deploymentMode: SingleBinary
        singleBinary:
          replicas: 1
          nodeSelector:
            pool: monitoring
          tolerations:
            - key: pool
              value: monitoring
              effect: NoSchedule
        backend:
          replicas: 0
        read:
          replicas: 0
        write:
          replicas: 0
        serviceAccount:
          annotations:
            iam.gke.io/gcp-service-account: loki-test@tanel-test-509115.iam.gserviceaccount.com
  destination:
    server: {{ .Values.spec.destination.server }}
    namespace: monitoring
  syncPolicy:
    {{ toYaml .Values.spec.syncPolicy | nindent 4 }}