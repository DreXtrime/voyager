variables:
  REGION: europe-north1
  SHARED_PROJECT: tanel-shared
  TEST_PROJECT: tanel-test-509115
  PROD_PROJECT: tanel-prod
  REGISTRY: europe-north1-docker.pkg.dev/tanel-shared/containers
  HELM_REGISTRY: europe-north1-docker.pkg.dev/tanel-shared/helm-charts
  BACKEND_IMAGE: ${REGISTRY}/backend
  FRONTEND_IMAGE: ${REGISTRY}/frontend
  TEST_CLUSTER: test-cluster
  PROD_CLUSTER: prod-cluster
  CLUSTER_ZONE: europe-north1-a
  DOCKER_HOST: unix:///var/run/docker.sock

stages:
  - test
  - build
  - deploy-test
  - deploy-prod

# -------------------------
# Test
# -------------------------
backend-tests:
  stage: test
  image: golang:1.24-alpine3.21
  script:
    - cd sample-app/backend
    - go mod tidy
    - go build ./...
    - go test ./... || true
  rules:
    - if: $CI_COMMIT_BRANCH

# -------------------------
# Build
# -------------------------
.build-template: &build-template
  stage: build
  image: docker:24
  before_script:
    - apk add --no-cache python3 py3-pip curl bash
    - curl -sSL https://sdk.cloud.google.com | bash -s -- --disable-prompts
    - export PATH=$PATH:/root/google-cloud-sdk/bin
    - gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet
  rules:
    - if: $CI_COMMIT_BRANCH

build-backend:
  <<: *build-template
  script:
    - export PATH=$PATH:/root/google-cloud-sdk/bin
    - docker build -t ${BACKEND_IMAGE}:${CI_COMMIT_SHA} -t ${BACKEND_IMAGE}:latest sample-app/backend/
    - docker push ${BACKEND_IMAGE}:${CI_COMMIT_SHA}
    - docker push ${BACKEND_IMAGE}:latest

build-frontend:
  <<: *build-template
  script:
    - export PATH=$PATH:/root/google-cloud-sdk/bin
    - docker build -t ${FRONTEND_IMAGE}:${CI_COMMIT_SHA} -t ${FRONTEND_IMAGE}:latest sample-app/frontend/
    - docker push ${FRONTEND_IMAGE}:${CI_COMMIT_SHA}
    - docker push ${FRONTEND_IMAGE}:latest

build-helm-backend:
  <<: *build-template
  script:
    - export PATH=$PATH:/root/google-cloud-sdk/bin
    - curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
    - gcloud auth print-access-token | helm registry login -u oauth2accesstoken --password-stdin ${REGION}-docker.pkg.dev
    - cd sample-app/backend/helm
    - helm package .
    - helm push *.tgz oci://${HELM_REGISTRY}

build-helm-frontend:
  <<: *build-template
  script:
    - export PATH=$PATH:/root/google-cloud-sdk/bin
    - curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
    - gcloud auth print-access-token | helm registry login -u oauth2accesstoken --password-stdin ${REGION}-docker.pkg.dev
    - cd sample-app/frontend/helm
    - helm package .
    - helm push *.tgz oci://${HELM_REGISTRY}

# -------------------------
# Deploy to test
# -------------------------
deploy-test:
  stage: deploy-test
  image: google/cloud-sdk:latest
  before_script:
    - gcloud container clusters get-credentials ${TEST_CLUSTER} --zone=${CLUSTER_ZONE} --project=${TEST_PROJECT}
    - curl -sSL -o /usr/local/bin/argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
    - chmod +x /usr/local/bin/argocd
    - argocd login ${ARGOCD_SERVER} --auth-token ${ARGOCD_TOKEN} --insecure --grpc-web
  script:
    - argocd app set backend --helm-set image.tag=${CI_COMMIT_SHA} --grpc-web
    - argocd app set frontend --helm-set image.tag=${CI_COMMIT_SHA} --grpc-web
    - argocd app sync backend --force --grpc-web
    - argocd app wait backend --timeout 300 --grpc-web
    - argocd app sync frontend --force --grpc-web
    - argocd app wait frontend --timeout 300 --grpc-web
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# -------------------------
# Deploy to prod
# -------------------------
deploy-prod:
  stage: deploy-prod
  image: google/cloud-sdk:latest
  before_script:
    - gcloud container clusters get-credentials ${PROD_CLUSTER} --zone=${CLUSTER_ZONE} --project=${PROD_PROJECT}
    - curl -sSL -o /usr/local/bin/argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
    - chmod +x /usr/local/bin/argocd
    - argocd login ${ARGOCD_SERVER} --auth-token ${ARGOCD_TOKEN} --insecure --grpc-web
  script:
    - argocd app set backend --helm-set image.tag=${CI_COMMIT_SHA} --grpc-web
    - argocd app set frontend --helm-set image.tag=${CI_COMMIT_SHA} --grpc-web
    - argocd app sync backend --force --grpc-web
    - argocd app wait backend --timeout 300 --grpc-web
    - argocd app sync frontend --force --grpc-web
    - argocd app wait frontend --timeout 300 --grpc-web
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  when: manual