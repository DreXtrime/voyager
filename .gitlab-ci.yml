variables:
  REGION: europe-north1
  SHARED_PROJECT: tanel-shared
  TEST_PROJECT: tanel-test-509115
  PROD_PROJECT: tanel-prod
  REGISTRY: europe-north1-docker.pkg.dev/tanel-shared/containers
  HELM_REGISTRY: europe-north1-docker.pkg.dev/tanel-shared/helm-charts
  BACKEND_IMAGE: ${REGISTRY}/backend
  FRONTEND_IMAGE: ${REGISTRY}/frontend
  TEST_CLUSTER: test-cluster
  PROD_CLUSTER: prod-cluster
  CLUSTER_ZONE: europe-north1-a
  DOCKER_HOST: unix:///var/run/docker.sock

stages:
  - test
  - build
  - update-tags
  - deploy-test
  - deploy-prod

# -------------------------
# Test
# -------------------------
backend-tests:
  stage: test
  image: golang:1.24-alpine3.21
  script:
    - cd sample-app/backend
    - go mod tidy
    - go build ./...
    - go test ./... || true
  rules:
    - if: $CI_COMMIT_BRANCH

# -------------------------
# Build
# -------------------------
.build-template: &build-template
  stage: build
  image: docker:24
  before_script:
    - apk add --no-cache python3 py3-pip curl bash
    - curl -sSL https://sdk.cloud.google.com | bash -s -- --disable-prompts
    - export PATH=$PATH:/root/google-cloud-sdk/bin
    - gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet
  rules:
    - if: $CI_COMMIT_BRANCH

build-backend:
  <<: *build-template
  script:
    - export PATH=$PATH:/root/google-cloud-sdk/bin
    - docker build -t ${BACKEND_IMAGE}:${CI_COMMIT_SHA} -t ${BACKEND_IMAGE}:latest sample-app/backend/
    - docker push ${BACKEND_IMAGE}:${CI_COMMIT_SHA}
    - docker push ${BACKEND_IMAGE}:latest

build-frontend:
  <<: *build-template
  script:
    - export PATH=$PATH:/root/google-cloud-sdk/bin
    - docker build -t ${FRONTEND_IMAGE}:${CI_COMMIT_SHA} -t ${FRONTEND_IMAGE}:latest sample-app/frontend/
    - docker push ${FRONTEND_IMAGE}:${CI_COMMIT_SHA}
    - docker push ${FRONTEND_IMAGE}:latest

build-helm-backend:
  <<: *build-template
  script:
    - export PATH=$PATH:/root/google-cloud-sdk/bin
    - curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
    - gcloud auth print-access-token | helm registry login -u oauth2accesstoken --password-stdin ${REGION}-docker.pkg.dev
    - cd sample-app/backend/helm
    - helm package .
    - helm push *.tgz oci://${HELM_REGISTRY}

build-helm-frontend:
  <<: *build-template
  script:
    - export PATH=$PATH:/root/google-cloud-sdk/bin
    - curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
    - gcloud auth print-access-token | helm registry login -u oauth2accesstoken --password-stdin ${REGION}-docker.pkg.dev
    - cd sample-app/frontend/helm
    - helm package .
    - helm push *.tgz oci://${HELM_REGISTRY}

# -------------------------
# Update tags
# -------------------------
update-tags:
  stage: update-tags
  image: alpine/git
  before_script:
    - git config --global user.email "gitlab-ci@gitlab"
    - git config --global user.name "GitLab CI"
    - git remote set-url origin https://oauth2:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git
  script:
    - |
      sed -i 's/tag:.*/tag: "'"$CI_COMMIT_SHA"'"/' sample-app/backend/helm/values.yaml
    - |
      sed -i 's/tag:.*/tag: "'"$CI_COMMIT_SHA"'"/' sample-app/frontend/helm/values.yaml
    - git add sample-app/backend/helm/values.yaml sample-app/frontend/helm/values.yaml
    - |
      git commit -m "ci: update image tags to $CI_COMMIT_SHA [skip ci]"
    - git push origin HEAD:main
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - "sample-app/**/*"