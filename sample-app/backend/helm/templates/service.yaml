apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-backend
  annotations:
    cloud.google.com/backend-config: '{"ports":{"8080":"{{ .Release.Name }}-backend"}}'
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ .Release.Name }}-backend
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8080
      protocol: TCP